<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <!-- Bootstrap -->
    <link th:href="@{/webjars/bootstrap/5.2.3/css/bootstrap.min.css}" rel="stylesheet">
    <!-- アイコン -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <title>Users</title>
</head>
<body>

<!-- ★ micropostshome と同じ header -->
<span th:replace="~{header :: header}"></span>

<main class="container">
    <h3 class="mt-3">ユーザー一覧</h3>

    <!-- ユーザー一覧 -->
    <div class="card mb-3" th:each="user : ${users}">
        <div class="row g-0">
            <!-- プロフィール画像（ダミー） -->
            <div class="col-md-2 d-flex align-items-center justify-content-center">
                <span style="font-size: 80px" class="material-icons">person</span>
            </div>

            <!-- ユーザー情報 -->
            <div class="col-md-10">
                <div class="card-body">
                    <h5 class="card-title" th:text="${user.name}">User Name</h5>

                    <!-- ボタン（見た目だけ） -->
                    <button type="button" class="btn btn-secondary btn-sm">
                        unfollow
                    </button>
                </div>
            </div>
        </div>
    </div>
</main>

</body>
</html>
